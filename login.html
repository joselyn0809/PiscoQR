<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | PISCO ORIGEN QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon-badge">
                    <i class="bi bi-qr-code-scan"></i>
                </div>
                <h1 class="h4 font-marca text-uppercase mb-1" style="color: var(--color-borgona);">PISCO ORIGEN QR</h1>
                <p class="small text-muted mb-0">Sistema de Trazabilidad Vitivinícola</p>
            </div>
            <div class="p-4">
                <div id="loginAlert" class="alert alert-danger d-none small" role="alert"></div>
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico institucional</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="admin@piscoorigen.pe" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" id="btnLogin" class="btn btn-borgona w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al Sistema
                    </button>
                </form>
                <div class="text-center mt-4 pt-3 border-top">
                    <a href="consulta.html" class="text-decoration-none small fw-semibold" style="color: var(--color-vino);">
                        <i class="bi bi-search me-1"></i>Ir a Consulta Pública de Trazabilidad QR
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
